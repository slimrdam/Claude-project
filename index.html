<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The debasement trade — an investment thesis</title>
<meta name="description" content="Why crypto, how much, and what the road there looks like. Five dashboards with live data.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e17'/%3E%3Cpath d='M6 22l6-8 5 5 4-7 5 10' stroke='%238b9bff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .hero{padding:52px 0 8px}
  .hero h1{max-width:19ch;margin-bottom:16px}
  .hero h1 em{font-style:normal;
    background:linear-gradient(92deg,var(--eth) 0%,#a78bfa 45%,var(--btc) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lede{font-size:16px;margin-top:14px}
  .cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;
    font-family:var(--display);font-weight:600;font-size:15px;color:#0a0e17;
    background:linear-gradient(135deg,var(--eth),#a78bfa);
    padding:11px 20px;border-radius:9px}
  .cta:hover{text-decoration:none;filter:brightness(1.08)}
  .ticks{margin-top:38px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
  .card{display:block;background:var(--panel);border:1px solid var(--rule);
    border-radius:var(--r);padding:20px;color:inherit;position:relative;transition:.16s}
  .card:hover{text-decoration:none;border-color:var(--accent);background:var(--panel-2)}
  .card .n{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
  .card h3{margin:9px 0 7px;font-size:19px}
  .card p{font-size:13.5px;color:var(--ink-2);margin:0;max-width:none}
  .card .go{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:12px;display:block}
  .card.wide{grid-column:1/-1}
  .card .bar{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px}
  @media (max-width:700px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body class="has-glow">
<main class="wrap page">
  <section class="hero">
    <p class="eyebrow spectrum" data-i18n="home.eyebrow"></p>
    <h1 data-i18n-html="home.h1"></h1>
    <p class="lede" data-i18n="home.lede"></p>
    <a class="cta" href="thesis.html" data-i18n="home.start"></a>
  </section>

  <div class="strip g3 ticks" id="ticks"></div>
  <div id="stalebox"></div>

  <section class="sec">
    <h2 data-i18n="home.parts"></h2>
    <div class="cards" id="cards"></div>
  </section>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script>
Shell.mount("home");
const { t } = I18N;
const S = Shell;

const CARDS = [
  ["01","thesis.html","home.c1.t","home.c1.d","var(--eth)"],
  ["02","allocation.html","home.c2.t","home.c2.d","#a78bfa"],
  ["03","path.html","home.c3.t","home.c3.d","var(--btc)"],
  ["04","sentiment.html","home.c4.t","home.c4.d","var(--neutral)"],
  ["05","sbet.html","home.c5.t","home.c5.d","var(--sbet)"]
];

function cards(){
  document.getElementById("cards").innerHTML = CARDS.map(([n,href,tk,dk,col],i)=>
    `<a class="card${i===4?" wide":""}" href="${href}">`+
      `<span class="bar" style="background:${col}"></span>`+
      `<span class="n">${n}</span>`+
      `<h3>${t(tk)}</h3><p>${t(dk)}</p>`+
      `<span class="go">${t("home.read")} →</span>`+
    `</a>`).join("");
}

function cell(k, v, x, col){
  return `<div class="cell"><div class="k">${k}</div>`+
         `<div class="v"${col?` style="color:${col}"`:""}>${v}</div>`+
         `<div class="x">${x||""}</div></div>`;
}

let DATA = null;
function ticks(){
  if(!DATA) return;
  const st = DATA.stats, m = DATA.market || {};
  const fng = m.fng, hicp = m.hicp;
  document.getElementById("ticks").innerHTML =
    cell(t("home.tick.eth"),  S.usd(st.eth_now),  S.date(DATA.series[DATA.series.length-1].d), "var(--eth)") +
    cell(t("home.tick.btc"),  S.usd(m.btc_usd),   S.date(DATA.series[DATA.series.length-1].d), "var(--btc)") +
    cell(t("home.tick.ratio"),S.num(st.ebtc_now,5), t("common.live")) +
    cell(t("home.tick.fng"),  fng ? fng.value : "—",
         fng ? S.fngLabel(fng.value) : "", fng ? S.fngColor(fng.value) : null) +
    cell(t("home.tick.infl"), hicp ? S.num(hicp.annual_rate,1)+" %" : "—",
         hicp ? t("common.asof")+" "+S.date(hicp.annual_rate_date) : "") +
    cell(t("home.tick.mnav"), S.num(st.mnav_now,3),
         st.mnav_now < 1 ? t("sb.mnav.d") : "", st.mnav_now < 1 ? "var(--up)" : "var(--ink)");

  const box = document.getElementById("stalebox");
  box.innerHTML = (m.stale && m.stale.length)
    ? `<div class="banner">${t("common.stale_market")}</div>` : "";
}

function render(){ cards(); ticks(); }
Shell.onLang(render);
cards();
S.loadData().then(d => { DATA = d; ticks(); })
            .catch(e => Shell.fail(document.getElementById("stalebox"), e));
</script>
</body>
</html>
