name: Probe feeds
# TEMPORARY diagnostic for the new market feeds. Delete once they are settled.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python probe_feeds.py
