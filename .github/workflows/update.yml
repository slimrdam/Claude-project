name: Refresh dashboard

on:
  schedule:
    - cron: "15 22 * * 2-6"   # 22:15 UTC Tue-Sat, ~2h after the US close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Rebuild data.json
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python update.py

      # data.json always carries a fresh "generated" stamp, so this commits on every
      # run. That is deliberate: GitHub disables scheduled workflows after 60 days
      # with no repository activity, and a daily commit keeps the cron alive.
      - name: Commit
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push

      # enablement:true asks the Pages API to create the site if it is missing.
      # It does NOT remove the one-time setup step: the Actions GITHUB_TOKEN is
      # refused on "create a Pages site" ("Resource not accessible by
      # integration") even holding pages:write, on a public repo. Pages has to
      # be switched on once by hand under Settings > Pages > Source: GitHub
      # Actions. This stays because once the site exists the action finds it and
      # skips creation, and it re-creates the site if Pages is ever turned off.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
