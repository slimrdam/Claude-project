# Manual only. The session container's egress policy blocks the data hosts, so a
# new feed is probed from a runner before anything is wired to it, and the shape
# is read out of this job's log.
name: Probe feeds

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -u tools/sbet_probe.py
