<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study — the debasement trade</title>
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .daily{max-height:420px;overflow:auto;border:1px solid var(--rule);
    border-radius:var(--r);background:var(--panel)}
  .daily table{font-size:12.5px}
  .daily th{position:sticky;top:0;background:var(--panel);z-index:1;
    padding:10px 12px 9px;border-bottom:1px solid var(--rule)}
  .daily td{padding:7px 12px}
  .daily td:first-child{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
  #tip{font-family:var(--mono);font-size:12px;color:var(--ink-2);min-height:18px;margin-top:8px}
  #tip b{color:var(--ink)}
  .runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-top:14px}
  .run{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
  .run .k{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .run .v{font-family:var(--display);font-size:20px;font-weight:600}
  .run .n{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
</style>
</head>
<body>
<main class="wrap page">
  <p class="eyebrow" data-i18n="cs.eyebrow"></p>
  <h1 data-i18n="cs.h1"></h1>
  <p class="lede" data-i18n="cs.lede"></p>

  <div id="stale"></div>

  <section class="sec" style="margin-top:26px">
    <h2 data-i18n="cs.s.today"></h2>
    <p class="lede" data-i18n="cs.s.today.lede"></p>
    <div class="strip g4" id="nav" style="margin-top:16px"></div>
    <p class="note" id="navnote" style="margin-top:14px"></p>
    <p class="note" id="mechnow" style="margin-top:10px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="cs.s.profile"></h2>
    <p class="lede" data-i18n="cs.s.profile.lede"></p>
    <div class="panel" id="profile" style="margin-top:16px"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.example"></h2>
    <p class="lede" data-i18n="sb.s.example.lede"></p>
    <div class="strip g4" id="figs" style="margin-top:16px"></div>
  </section>

  <section class="sec">
    <h2 id="h-months"></h2>
    <p class="lede" id="l-months"></p>
    <div class="chartbox" style="margin-top:12px">
      <svg id="mbars" class="chart" viewBox="0 0 920 230" preserveAspectRatio="none"></svg>
    </div>
    <div class="runs" id="runs"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.main"></h2>
    <p class="lede" data-i18n="sb.s.main.lede"></p>
    <div class="legend" id="mainLegend"></div>
    <div class="chartbox" style="margin-top:10px">
      <svg id="main" class="chart" viewBox="0 0 920 420" preserveAspectRatio="none"></svg>
      <div id="tip"></div>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.mnav"></h2>
    <p class="lede" data-i18n="sb.s.mnav.lede"></p>
    <div class="chartbox" style="margin-top:12px">
      <svg id="mnav" class="chart" viewBox="0 0 920 220" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.hold"></h2>
    <p class="lede" data-i18n="sb.s.hold.lede"></p>
    <div class="chartbox" style="margin-top:12px">
      <svg id="hold" class="chart" viewBox="0 0 920 210" preserveAspectRatio="none"></svg>
    </div>
    <p class="note" id="holdNote" style="margin-top:12px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="cs.s.own"></h2>
    <p class="lede" data-i18n="cs.s.own.lede"></p>
    <div class="bars" id="holders" style="margin-top:16px"></div>
    <div class="legend" id="holderskey" style="margin-top:12px"></div>
    <p class="note" id="holdersnote" style="margin-top:12px"></p>
    <p class="note dim" id="holderssrc" style="margin-top:8px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.short"></h2>
    <p class="lede" data-i18n="sb.s.short.lede"></p>
    <div class="strip g4" id="short" style="margin-top:16px"></div>
    <p class="note" id="shortread" style="margin-top:14px"></p>

    <h3 data-i18n="cs.sq.title" style="margin-top:26px"></h3>
    <p class="lede" data-i18n="cs.sq.lede" style="margin-top:6px"></p>
    <div class="cases" id="sq" style="margin-top:14px"></div>
    <p class="note" data-i18n="cs.sq.note" style="margin-top:14px"></p>

    <h3 data-i18n="cs.s.short.hist" style="margin-top:26px"></h3>
    <div class="chartbox" style="margin-top:12px">
      <svg id="shortchart" class="chart" viewBox="0 0 920 200" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.table"></h2>
    <p class="lede" data-i18n="sb.s.table.lede"></p>
    <div class="daily" style="margin-top:12px">
      <table><thead><tr id="dhead"></tr></thead><tbody id="drows"></tbody></table>
    </div>
  </section>

  <p class="note" data-i18n="sb.note" style="margin-top:26px"></p>
  <p class="note" data-i18n="sb.risk" style="margin-top:12px"></p>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/casestudy.js"></script>
</body>
</html>
