<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasury companies — the debasement trade</title>
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .worked{margin-top:16px}
  /* One row per company: name and size on the left, what makes it different on the
     right, and the single fact that decides its risk pinned to the end. */
  .tw{display:flex;flex-direction:column;gap:10px}
  .twr{display:grid;grid-template-columns:minmax(150px,.85fr) 1.6fr auto;gap:16px;align-items:center;
    background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
  .twr .tk{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3)}
  .twr .nm{font-family:var(--display);font-size:15.5px;font-weight:600;margin-top:3px}
  .twr .sz{font-family:var(--mono);font-size:12.5px;margin-top:5px}
  .twr p{font-size:13px;color:var(--ink-2);margin:0;max-width:none}
  .twr .dbt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;border:1px solid;border-radius:20px;padding:6px 11px}
  @media (max-width:720px){ .twr{grid-template-columns:1fr;gap:9px} .twr .dbt{justify-self:start} }
</style>
</head>
<body>
<main class="wrap page">
  <p class="eyebrow" data-i18n="sb.eyebrow"></p>
  <h1 data-i18n="sb.h1"></h1>
  <p class="lede" data-i18n="sb.lede"></p>

  <section class="sec" style="margin-top:26px">
    <h2 data-i18n="sb.s.what"></h2>
    <p class="lede" data-i18n-html="sb.s.what.lede"></p>
    <div class="strip g4 worked" id="worked"></div>
    <p class="note" id="workednote" style="margin-top:14px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.raise"></h2>
    <p class="lede" data-i18n="sb.s.raise.lede"></p>
    <div class="grid g3" id="raise" style="margin-top:16px"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.mech"></h2>
    <p class="lede" data-i18n="sb.s.mech.lede"></p>
    <div class="cases" id="mech" style="margin-top:16px"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.two"></h2>
    <p class="lede" data-i18n="sb.s.two.lede"></p>
    <div class="cases" id="two" style="margin-top:16px"></div>
    <p class="note" data-i18n-html="sb.two.note" style="margin-top:14px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="sb.s.who"></h2>
    <p class="lede" data-i18n="sb.s.who.lede"></p>
    <div class="tw" id="who" style="margin-top:16px"></div>
    <p class="note dim" id="whosrc" style="margin-top:12px"></p>
  </section>

  <p class="note" data-i18n="sb.next" style="margin-top:26px"></p>
  <p class="note" data-i18n="sb.risk" style="margin-top:12px"></p>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/sbet.js"></script>
</body>
</html>
