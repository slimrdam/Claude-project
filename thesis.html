<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The case — the debasement trade</title>
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  h1 em{font-style:normal;background:linear-gradient(92deg,var(--eth),#a78bfa);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .q{background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--eth);
     border-radius:0 0 var(--r) var(--r);padding:17px}
  .q .who{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-3)}
  .q .h{font-family:var(--display);font-size:15.5px;font-weight:600;margin:8px 0 7px;line-height:1.25}
  .q p{font-size:13px;color:var(--ink-2);margin:0;max-width:none}
  .bars{display:flex;flex-direction:column;gap:9px}
  .br{display:grid;grid-template-columns:minmax(120px,1.1fr) 1fr 86px;gap:14px;align-items:center;font-size:13px}
  .br .n{color:var(--ink-2)}
  .br .t{height:10px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
  .br .t>i{display:block;height:100%;border-radius:2px}
  .br .v{font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:right;color:var(--ink)}
  .math{background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--r);
    padding:20px;margin:18px 0;font-family:var(--mono);font-size:13.5px;line-height:1.85}
  .math .big{font-family:var(--display);font-size:clamp(19px,3vw,27px);font-weight:600;
    letter-spacing:-.02em;color:var(--eth);line-height:1.25;margin-top:6px}
  .nextlink{display:inline-block;margin-top:34px;font-family:var(--display);
    font-weight:600;font-size:16px}
  @media (max-width:620px){ .br{grid-template-columns:1fr;gap:3px}.br .v{text-align:left} }
</style>
</head>
<body>
<main class="wrap page">
  <p class="eyebrow" data-i18n="th.eyebrow"></p>
  <h1 data-i18n-html="th.h1"></h1>
  <p class="lede" data-i18n="th.lede"></p>

  <section class="sec">
    <h2 data-i18n="th.s0"></h2>
    <p class="lede" data-i18n="th.s0.lede"></p>
    <div class="grid g3" id="words" style="margin-top:16px"></div>
    <p class="note" data-i18n="th.s0.note" style="margin-top:14px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="th.s1"></h2>
    <p class="lede" data-i18n="th.s1.lede"></p>
    <div class="strip g4" id="infl" style="margin-top:16px"></div>
    <h3 id="h-windows" style="margin-top:26px"></h3>
    <p class="lede" id="l-windows" style="margin-top:6px"></p>
    <div class="panel" style="margin-top:12px"><div class="bars" id="windows"></div></div>
    <p class="note" id="inflnote" style="margin-top:14px"></p>
    <div class="panel" style="margin-top:16px"><div class="bars" id="erosion"></div></div>
  </section>

  <section class="sec">
    <h2 data-i18n="th.s2"></h2>
    <p class="lede" data-i18n="th.s2.lede"></p>
    <div class="strip g4" id="network" style="margin-top:16px"></div>
    <p class="note" id="netnote" style="margin-top:14px"></p>
    <h3 data-i18n="th.s2.why" style="margin-top:26px"></h3>
    <div class="cases" id="why" style="margin-top:12px"></div>
    <p class="note" data-i18n="th.s2.why.note" style="margin-top:14px"></p>
    <div class="grid g4" id="adoption" style="margin-top:26px"></div>
    <p class="note" id="caveat" style="margin-top:12px"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="th.s3"></h2>
    <p class="lede" data-i18n="th.s3.lede"></p>
    <div class="grid g3" id="quotes" style="margin-top:16px"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="th.s4"></h2>
    <p class="lede" data-i18n="th.s4.lede"></p>

    <h3 data-i18n="th.f.title" style="margin-top:24px"></h3>
    <p class="lede" data-i18n="th.f.lede" style="margin-top:6px"></p>
    <div class="grid g2" id="forecasts" style="margin-top:12px"></div>
    <p class="note" id="fcaveat" style="margin-top:12px"></p>

    <h3 data-i18n="th.a.title" style="margin-top:28px"></h3>
    <div class="strip g3" id="alloc" style="margin-top:12px"></div>
    <p class="note" id="allocnote" style="margin-top:12px"></p>

    <h3 data-i18n="th.g.title" style="margin-top:28px"></h3>
    <div class="strip g3" id="gold" style="margin-top:12px"></div>
    <p class="note" id="goldnote" style="margin-top:12px"></p>

    <h3 data-i18n="th.s4.cases" style="margin-top:28px"></h3>
    <div class="cases" id="cases" style="margin-top:12px"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="th.s5"></h2>
    <p class="lede" data-i18n="th.s5.lede"></p>
    <div class="panel" style="margin-top:16px">
      <p class="eyebrow" data-i18n="th.s4.ratio" style="margin-bottom:14px"></p>
      <div class="bars" id="ratio"></div>
    </div>
    <h3 data-i18n="th.s5.how" style="margin-top:24px"></h3>
    <p class="note" id="ratioread" style="margin-top:8px"></p>
    <div class="math" id="math"></div>
    <div class="panel" style="margin-top:16px;border-color:rgba(139,155,255,.45)">
      <div class="lbl" style="font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
        text-transform:uppercase;color:var(--accent)" data-i18n="th.s5.default"></div>
      <p class="note" data-i18n="th.s5.default.d" style="margin:10px 0 0"></p>
    </div>
  </section>

  <a class="nextlink" href="allocation.html" data-i18n="th.next"></a>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script>
Shell.mount("thesis");
const { t } = I18N, S = Shell;
const FR = () => I18N.lang === "fr";
let D = null;

const cell = (k,v,x,col) =>
  `<div class="cell"><div class="k">${k}</div>`+
  `<div class="v"${col?` style="color:${col}"`:""}>${v}</div><div class="x">${x||""}</div></div>`;

const bar = (name, w, val, col) =>
  `<div class="br"><span class="n">${name}</span>`+
  `<span class="t"><i style="width:${Math.max(2,Math.min(100,w))}%;background:${col}"></i></span>`+
  `<span class="v">${val}</span></div>`;

const SAVINGS_RATE = 0.0125;   // typical French livret, the comparison baseline

function render(){
  if(!D) return;

  /* --- vocabulary, before anything that uses it --------------------------- */
  /* six terms in the grid, then the consequence of the last two across its full
     width, since it is what they add up to rather than a seventh definition */
  document.getElementById("words").innerHTML = [1,2,3,4,5,6,7].map(i =>
    `<div class="panel pad-sm"${i === 7 ? ' style="grid-column:1/-1"' : ""}>` +
    `<div style="font-family:var(--display);font-size:15px;` +
    `font-weight:600;margin-bottom:6px">${t("th.w"+i+".t")}</div>` +
    `<p class="note" style="margin:0">${t("th.w"+i+".d")}</p></div>`).join("");

  const m = D.market || {}, h = m.hicp, st = D.stats, notes = D.notes || {};

  /* --- inflation -------------------------------------------------------- */
  /* The headline is a multi-year compound average, not last month's print: over a
     holding period that is the number that decides what cash costs you. HEADLINE_YEARS
     picks the longest window the ECB series supports up to 10 years. */
  const win = (h && h.avg) || {};
  const HEADLINE = ["5","10","3"].find(k => win[k]) || "all";
  const infl = win[HEADLINE] ? win[HEADLINE].rate : (h ? h.annual_rate/100 : null);
  const hn = HEADLINE === "all" ? null : HEADLINE;
  const real = infl != null ? (1+SAVINGS_RATE)/(1+infl) - 1 : null;

  document.getElementById("infl").innerHTML =
    cell(hn ? t("th.s1.avg",{n:hn}) : t("th.s1.avg.all",{from:h?S.date(win.all.from):""}),
         infl != null ? S.pct(infl,1) : "—",
         win[HEADLINE] ? t("common.asof")+" "+S.date(h.index_date) : "", "var(--down)") +
    cell(t("th.s1.peak"), h && h.peak_12m != null ? S.pct(h.peak_12m,1) : "—",
         h && h.peak_12m_date ? t("th.s1.peak.x",{date:S.date(h.peak_12m_date)}) : "", "var(--warn)") +
    cell(t("th.s1.loss",{base:h?S.date(h.base_date):"2000"}),
         h ? S.pct(h.loss_since,0) : "—",
         h ? t("common.asof")+" "+S.date(h.index_date) : "", "var(--down)") +
    cell(t("th.s1.real"), real!=null ? S.signed(real,2) : "—",
         t("th.s1.savings")+" "+S.pct(SAVINGS_RATE,2), "var(--down)");

  /* every window, so nothing is being cherry-picked */
  document.getElementById("h-windows").textContent = t("th.s1.windows");
  document.getElementById("l-windows").textContent = t("th.s1.windows.lede");
  const rows = [];
  ["3","5","10"].forEach(k => { if (win[k]) rows.push([t("th.s1.win.n",{n:k}), win[k].rate]); });
  if (win.all) rows.push([t("th.s1.win.all",{from:S.date(win.all.from)}), win.all.rate]);
  if (h) rows.push([t("th.s1.win.latest")+" ("+S.date(h.annual_rate_date)+")", h.annual_rate/100]);
  const top = Math.max.apply(null, rows.map(r => r[1]).concat([SAVINGS_RATE]));
  document.getElementById("windows").innerHTML =
    rows.map(([n,v]) => bar(n, v/top*100, S.pct(v,1),
      v > SAVINGS_RATE ? "var(--down)" : "var(--ink-3)")).join("") +
    bar(t("th.s1.savings"), SAVINGS_RATE/top*100, S.pct(SAVINGS_RATE,2), "var(--ink-3)");

  if(infl != null){
    const after = 50000 * Math.pow((1+SAVINGS_RATE)/(1+infl), 10);
    document.getElementById("inflnote").textContent =
      t("th.s1.note",{rate:S.pct(SAVINGS_RATE,2), infl:S.pct(infl,1),
                      n:hn || "26", result:S.eur(after)});
    const lost = 1 - Math.pow((1+SAVINGS_RATE)/(1+infl), 10);
    document.getElementById("erosion").innerHTML =
      bar(FR()?"50 000 € aujourd'hui":"€50,000 today", 100, S.eur(50000), "var(--ink-3)") +
      bar(FR()?"Après 10 ans sur un livret, en pouvoir d'achat":"After 10 years in a savings account, in purchasing power",
          (1-lost)*100, S.eur(after), "var(--down)") +
      bar(FR()?"Ce que l'inflation a pris":"What inflation took",
          lost*100, "−"+S.eur(50000-after), "var(--warn)");
  }

  /* --- network ---------------------------------------------------------- */
  const sc = m.stables, tv = m.tvl;
  const ATH = 4946;   // stated in the scenario file; ether's August 2025 high
  document.getElementById("network").innerHTML =
    cell(t("th.s2.stables"), sc ? S.big(sc.ethereum,"USD") : "—",
         sc ? t("th.s2.stables.x",{total:S.big(sc.total,"USD")}) : "", "var(--eth)") +
    cell(t("th.s2.tvl"), tv ? S.big(tv.ethereum,"USD") : "—",
         tv ? t("th.s2.tvl.x",{share:S.pct(tv.eth_share,0)}) : "", "var(--eth)") +
    cell(t("th.s2.share"), sc ? S.pct(sc.eth_share,0) : "—", t("common.live")) +
    cell(t("th.s2.price"), S.signed(st.eth_now/ATH - 1, 0),
         S.usd(st.eth_now)+" / "+S.usd(ATH), "var(--down)");
  document.getElementById("netnote").textContent = t("th.s2.note");

  document.getElementById("why").innerHTML = [["btc","var(--btc)"],["eth","var(--eth)"]].map(([k,col])=>
    `<div class="case" style="border-color:${col}33">` +
    `<div class="lbl" style="color:${col}">${t("th.s2.why."+k+".t")}</div>` +
    `<p class="note" style="margin:10px 0 0">${t("th.s2.why."+k+".d")}</p></div>`).join("");

  const ad = notes.adoption || {cards:[]};
  document.getElementById("adoption").innerHTML = (ad.cards||[]).map(c=>{
    const [en,fr,val,den,dfr] = c;
    return `<div class="panel pad-sm"><div class="k" style="font-family:var(--mono);font-size:10px;`+
      `letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)">${FR()?fr:en}</div>`+
      `<div style="font-family:var(--display);font-size:21px;font-weight:600;margin:7px 0 5px">${val}</div>`+
      `<div style="font-size:12px;color:var(--ink-3);line-height:1.45">${FR()?dfr:den}</div></div>`;
  }).join("");
  document.getElementById("caveat").innerHTML =
    `<span class="asof">${t("common.editorial")} · ${t("common.asof")} ${S.date(ad.as_of)}</span> — `+
    (FR()? (ad.caveat_fr||"") : (ad.caveat||""));

  /* --- quotes ----------------------------------------------------------- */
  document.getElementById("quotes").innerHTML = (notes.quotes||[]).map(q=>
    `<div class="q"><div class="who">${FR()?q.who_fr:q.who}</div>`+
    `<div class="h">${FR()?q.head_fr:q.head}</div>`+
    `<p>${FR()?q.body_fr:q.body}</p></div>`).join("");

  /* --- what backs the valuations ---------------------------------------- */
  const A = D.assumptions, ref = A.ethbtc_reference, now = st.ebtc_now;
  const fc = notes.forecasts || {}, va = notes.valuation_anchors || {};

  const spotOf = k => k === "eth" ? st.eth_now : (m.btc_usd || 0);
  document.getElementById("forecasts").innerHTML = ["btc","eth"].map(k => {
    const col = k === "eth" ? "var(--eth)" : "var(--btc)";
    const rows = (fc[k] || []).map(f =>
      `<div class="br"><span class="n">${f.who}<br><span class="dim" style="font-size:11.5px">${
        FR() ? (f.note_fr || f.note) : f.note}</span></span>` +
      `<span class="t"><i style="width:${Math.min(100, f.usd / Math.max(...(fc[k]||[{usd:1}]).map(x=>x.usd)) * 100)}%;background:${col}"></i></span>` +
      `<span class="v">${S.usd(f.usd)}<br><span class="dim" style="font-size:11px">${
        S.num(f.usd / (spotOf(k) || 1), 1)}×</span></span></div>`).join("");
    return `<div class="panel"><div class="lbl" style="font-family:var(--mono);font-size:10.5px;` +
      `letter-spacing:.15em;text-transform:uppercase;color:${col};margin-bottom:12px">` +
      `${t("common." + k)} · ${t("th.f.from", {spot: S.usd(spotOf(k))})}</div>` +
      `<div class="bars">${rows}</div></div>`;
  }).join("");
  document.getElementById("fcaveat").innerHTML =
    `<span class="asof">${t("common.editorial")} · ${t("common.asof")} ${S.date(fc.as_of)}</span> — ` +
    (FR() ? (fc.caveat_fr || "") : (fc.caveat || ""));

  const aum = (va.aum_top3_usd_bn || 0) * 1e9, alloc = va.allocation_pct || 0;
  document.getElementById("alloc").innerHTML =
    cell(t("th.a.aum"), S.big(va.aum_top3_usd_bn, "USD"),
         FR() ? va.aum_note_fr : va.aum_note) +
    cell(t("th.a.pct"), S.pct(alloc, 1), FR() ? va.allocation_note_fr : va.allocation_note) +
    cell(t("th.a.flow"), S.big(va.aum_top3_usd_bn * alloc, "USD"), "", "var(--eth)");
  document.getElementById("allocnote").textContent = t("th.a.lede", {
    aum: S.big(va.aum_top3_usd_bn, "USD"), pct: S.pct(alloc, 1),
    flow: S.big(va.aum_top3_usd_bn * alloc, "USD")});

  const btcTgt = A.cases.base.btc_usd, capBn = btcTgt * (va.btc_supply_m || 19.9) * 1e6 / 1e9;
  document.getElementById("gold").innerHTML =
    cell(t("th.g.cap"), S.big(capBn, "USD"), S.usd(btcTgt) + " × " + S.num(va.btc_supply_m, 1) + "M", "var(--btc)") +
    cell(t("th.g.gold"), S.big(va.gold_market_usd_bn, "USD"), t("common.editorial")) +
    cell(t("th.g.share"), S.pct(capBn / (va.gold_market_usd_bn || 1), 0), "", "var(--btc)");
  document.getElementById("goldnote").textContent = t("th.g.lede", {
    target: S.usd(btcTgt), cap: S.big(capBn, "USD"), gold: S.big(va.gold_market_usd_bn, "USD"),
    share: S.pct(capBn / (va.gold_market_usd_bn || 1), 0)});
  const scale = v => v/0.08*100;
  document.getElementById("ratio").innerHTML =
    bar(t("th.s4.ratio.now"), scale(now), S.num(now,4), "var(--down)") +
    bar(t("th.s4.ratio.10y"), scale(ref.avg_10y), S.num(ref.avg_10y,3), "var(--ink-3)") +
    bar(t("th.s4.ratio.target"), scale(ref.target), S.num(ref.target,3), "var(--eth)") +
    bar((FR()?"Moyenne ":"Average ")+"2023", scale(ref.avg_2023), S.num(ref.avg_2023,3), "var(--ink-3)") +
    bar((FR()?"Moyenne ":"Average ")+"2022", scale(ref.avg_2022), S.num(ref.avg_2022,3), "var(--ink-3)");

  const base = A.cases.base;
  const gap = now / ref.avg_10y - 1;
  document.getElementById("ratioread").textContent = t("th.s5.read", {
    avg: S.num(ref.avg_10y, 3), now: S.num(now, 4),
    verdict: t(gap < 0 ? "th.s5.below" : "th.s5.above", {pct: S.pct(Math.abs(gap), 0)})});
  document.getElementById("math").innerHTML =
    `<div>${S.usd(base.btc_usd)} × ${S.num(base.ethbtc,3)}</div>`+
    `<div class="big">= ${S.usd(base.eth_usd)} ${FR()?"par ether":"per ether"}`+
    `<span style="color:var(--ink-3);font-size:.62em"> · ${S.num(base.eth_usd/st.eth_now,1)}×</span></div>`+
    `<p class="note" style="font-family:var(--body);margin:14px 0 0">${
      t("th.s5.math",{btc:S.usd(base.btc_usd), ratio:S.num(base.ethbtc,3), eth:S.usd(base.eth_usd)})}</p>`;

  document.getElementById("cases").innerHTML = ["base","bull"].map(k=>{
    const c = A.cases[k];
    return `<div class="case${k==="bull"?" bull":""}">`+
      `<div class="lbl">${t("common."+k)} · ${t("th.s4.horizon",{year:A.horizon_year})}</div>`+
      `<div class="row"><span>${t("common.btc")}</span><b style="color:var(--btc)">${S.usd(c.btc_usd)}</b></div>`+
      `<div class="row"><span>${t("common.eth")}</span><b style="color:var(--eth)">${S.usd(c.eth_usd)}</b></div>`+
      `<div class="row"><span class="dim">${FR()?"depuis le cours actuel":"from spot"}</span>`+
      `<span class="dim">${S.num(c.btc_usd/(D.market.btc_usd||1),1)}× / ${S.num(c.eth_usd/st.eth_now,1)}×</span></div>`+
      `</div>`;
  }).join("");
}

Shell.onLang(render);
S.loadData().then(d=>{D=d;render();}).catch(e=>Shell.fail(document.getElementById("infl"),e));
</script>
</body>
</html>
