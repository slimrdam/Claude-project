<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How much — the debasement trade</title>
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .band{display:flex;height:60px;border-radius:8px;overflow:hidden;background:var(--rule);margin-top:16px}
  .seg-b{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 11px;
    color:#06090f;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(10,14,23,.35)}
  .seg-b:last-child{border-right:0}
  .seg-b .nm{font-size:11px;opacity:.82;text-overflow:ellipsis;overflow:hidden}
  .seg-b .rt{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.1}
  .seg-b.sm .nm{display:none}
  .bandkey{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
  .bandkey i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}
  .field label{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--ink-2);margin-bottom:7px;gap:12px}
  .field label b{font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600}
  .ticks2{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  /* The two groups answer different questions - what you hold now, and what you
     add each month - so they are separated rather than sharing one row of boxes. */
  .setgrp h3{margin:0 0 4px;font-size:15.5px}
  .setgrp>.note{margin:0 0 14px}
  .setgrp>.note:last-child{margin:14px 0 0}
  .inp .rate{float:right;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:500}
  .inp label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
  .inp input{width:100%}
  .proj{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule);font-size:13px}
  .proj .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--ink-2)}
  .proj .row b{color:var(--ink);font-weight:600}
  .proj .price{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .proj .from{font-size:12px;color:var(--ink-3);margin-bottom:8px}
  .nextlink{display:inline-block;margin-top:34px;font-family:var(--display);font-weight:600;font-size:16px}
  .swap{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<main class="wrap page">
  <p class="eyebrow" data-i18n="al.eyebrow"></p>
  <h1 data-i18n-html="al.h1"></h1>
  <p class="lede" data-i18n-html="al.lede"></p>
  <div class="banner" style="border-color:var(--rule);background:var(--panel);color:var(--ink-2)">
    <span data-i18n="al.hypothetical"></span>
    <div class="swap">
      <button class="btn ghost" id="reset" data-i18n="al.reset"></button>
      <span class="asof" id="savedmsg"></span>
    </div>
  </div>

  <div class="band" id="band"></div>
  <div class="bandkey" id="bandkey"></div>

  <div class="panel setgrp" style="margin-top:18px">
    <h3 data-i18n="al.g.start"></h3>
    <p class="note dim" data-i18n="al.g.start.d"></p>
    <div class="inputs" id="startinputs"></div>
    <p class="note" id="startnote"></p>
  </div>

  <div class="panel setgrp" style="margin-top:12px">
    <h3 data-i18n="al.g.month"></h3>
    <p class="note dim" data-i18n="al.g.month.d"></p>
    <div class="inputs" id="monthinputs"></div>
    <p class="note" id="monthnote"></p>
  </div>

  <div class="seg" id="scenario" style="margin-top:20px" role="group">
    <button data-sc="base" aria-pressed="true"></button>
    <button data-sc="sim" aria-pressed="false"></button>
  </div>
  <p class="note" id="scnote" style="margin-top:8px"></p>

  <div class="strip g4" id="figs" style="margin-top:14px"></div>

  <section class="sec">
    <h2 data-i18n="al.chart"></h2>
    <div class="legend" id="legend"></div>
    <div class="chartbox" style="margin-top:10px">
      <svg id="chart" class="chart" viewBox="0 0 860 400" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="al.positions"></h2>
    <div class="tbl-scroll" style="margin-top:12px">
      <table><thead><tr id="thead"></tr></thead>
      <tbody id="rows"></tbody><tfoot><tr id="tfoot"></tr></tfoot></table>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="al.params"></h2>
    <div class="panel" style="margin-top:14px">
      <div class="field">
        <label for="years"><span data-i18n="al.years"></span><b id="yearsV"></b></label>
        <input type="range" id="years" min="3" max="30" step="1" value="15">
        <div class="ticks2"><span>3</span><span>15</span><span>30</span></div>
      </div>
      <button class="btn" id="preset" style="margin-top:14px"></button>
      <p class="note" id="presetnote" style="margin:8px 0 0"></p>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="panel" id="ethpanel"></div>
      <div class="panel" id="btcpanel"></div>
    </div>
  </section>

  <section class="sec">
    <h2 data-i18n="al.risk"></h2>
    <p class="lede" id="risklede"></p>
    <div class="strip g3" id="risk" style="margin-top:14px"></div>
    <p class="note" id="risknote" style="margin-top:14px"></p>
  </section>

  <a class="nextlink" href="path.html" data-i18n="al.next"></a>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/allocation.js"></script>
</body>
</html>
